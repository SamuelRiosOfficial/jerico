name: Build JERICO Android APK and PWA

on:
  push:
    branches:
      - mobile/android-pwa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://sgzattxgduoowsmijifa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gYYVuo4ejQqkiWUWxTpp1Q_3At7lpJD

    steps:
      - name: Checkout isolated mobile branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run existing game tests
        run: npm test

      - name: Build installable PWA bundle
        run: |
          npm run build:mobile
          mkdir -p output
          cd dist
          zip -qr ../output/JERICO-PWA-Web.zip .

      - name: Build native Android web bundle
        run: |
          JERICO_NATIVE_BUILD=1 npm run build:mobile

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/JERICO-Android-Test.apk
          ls -lh output

      - name: Upload APK and PWA
        uses: actions/upload-artifact@v4
        with:
          name: JERICO-Android-and-PWA
          path: output/*
          if-no-files-found: error
          retention-days: 30
